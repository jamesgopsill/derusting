[package]
name = "derusting"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
bitflags = "2"
cortex-m = {
  version = "0.7",
  features = ["critical-section-single-core"]
}
critical-section = "1"
embassy-executor = {
  version = "0.10",
  features = ["embassy-time-driver"]
}
embassy-net = "0.9"
embassy-sync = "0.8"
embassy-time-queue-utils = "0.3"
embassy-time-driver = "0.2"
embassy-time = {
  version = "0.5",
  features = ["tick-hz-1_000", "generic-queue-8"]
}
embedded-io = "0.7"
num_enum = {
  version = "0.7",
  default-features = false
}
portable-atomic = "1"
picoserve = {
  version = "0.19",
  features = ["embassy"]
}
static_cell = "2"
